<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DoomSlop</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23c8503c'/></svg>"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- Crosshair + readouts. Text is filled in by src/hud.js. -->
    <div id="hud" aria-hidden="true">
      <!-- Damage / pickup vignette: a tint pulsing in from the edges of the view,
           red when the player is hit, green for health and blue for armor. hud.js
           swaps the color class and retriggers the animation; like #notice and
           #muzzle its whole duration lives in style.css, since nothing waits on
           it. First in the HUD on purpose — later siblings paint over earlier
           ones, so a full-screen tint has to go under every readout and every
           flash, none of which should be dimmed by it. -->
      <div id="vignette"></div>
      <div id="crosshair"></div>
      <!-- Wedges pointing at whatever just hit the player, arranged around the
           crosshair. Deliberately empty: hud.js fills it with a pool of
           HITMARK.pool slots and rotates each one to the bearing of a hit. -->
      <div id="hitmarks"></div>
      <!-- Muzzle flash: a warm glow at the bottom of the screen, since there's
           no weapon model to flash. hud.js retriggers its CSS animation. -->
      <div id="muzzle"></div>
      <!-- Vitals, bottom center: two bars, each with its number under it. On their
           own rather than in #readout because these are what decide whether to break
           off and go find a drop, so they sit where the eye already is — under the
           crosshair — and can be read without looking away from what's shooting at
           you. After #muzzle in the source so the flash glows behind them rather
           than over them.

           One stack (#vitals) rather than four absolutely positioned elements: each
           bar sits above its text in normal flow, so either font size can change
           without re-deriving an offset — the same arrangement #announce-sub has
           under #announce-title. The stack is anchored at the *bottom*, so it grows
           upward and #health stays put as things are added above it. hud.js writes
           the two fills' widths and the two numbers; everything else is style.css.

           The bars carry the read and the numbers are matched labels on them, which
           is why HP, AP and SB are the same size as each other and differ only in
           color. Armor is above health because it's the buffer in front of it, so it
           reads as sitting in the way of the damage; both are always drawn, even at
           AP 0 — an empty bar is accurate where #progress's frozen 25/25 would have
           been misleading, and a pair that appeared and vanished would be movement
           right where the player's eye rests under fire.

           The boots pair on top is the exception to that last point and has to be:
           a timer at zero is a countdown on nothing, where an empty pool is a true
           statement about a resource the player always has. It's on top because it's
           the only one of the three that's about to vanish. -->
      <div id="vitals">
        <!-- SUPER BOOTS timer, on top of the two pools. Wrapped, unlike the pairs
             below, for two reasons: the whole pair appears and disappears with the
             buff, and one element toggling beats two that could disagree about
             whether they're on screen; and the wrapper carries the seam margin
             between this pair and the armor one, the job #armor's does lower down.
             Hidden here in the markup, so it can't paint before hud.js first runs.
             Its text is a countdown rather than a level, hence #bootstime — the two
             ids below are the pools they name. -->
        <div id="boots" class="hidden">
          <div id="bootsbar"><div id="bootsbar-fill"></div></div>
          <div id="bootstime">SB --</div>
        </div>
        <div id="armorbar"><div id="armorbar-fill"></div></div>
        <div id="armor">AP --</div>
        <div id="healthbar"><div id="healthbar-fill"></div></div>
        <div id="health">HP --</div>
      </div>
      <div id="readout">
        <span id="score">SCORE --</span>
        <span id="round">ROUND --</span>
        <span id="progress">KILLS --</span>
      </div>
      <!-- Controls reference, top left. It's the only list of the controls anywhere:
           the overlay used to repeat the movement keys, which meant two copies to
           keep in step. Visible during play and dimmed behind the pause overlay, so
           it covers the start screen too.

           One row of it isn't static, unlike #build: the music row's action text is
           written by hud.updateMusic() and reads MUSIC ON / MUSIC OFF. The state
           belongs next to the key that changes it — the music starts off, so a
           player noticing the silence and a player looking for the key to fix it are
           the same person — and every other corner of the screen is occupied. It
           starts as a placeholder for the same reason HP does: unwritten, it says so
           rather than claiming a state. -->
      <div id="controls">
        <span class="key">WASD</span><span>MOVE</span>
        <span class="key">SPACE</span><span>JUMP</span>
        <span class="key">MOUSE</span><span>LOOK</span>
        <span class="key">CLICK</span><span>SHOOT</span>
        <span class="key">ESC</span><span>PAUSE</span>
        <span class="key">~</span><span>SKIP ROUND</span>
        <span class="key">M</span><span id="musicstate">MUSIC --</span>
      </div>
      <!-- Round and boss announcements. hud.js sets the text and retriggers the
           CSS animation. The flash lives on the wrapper so the title and the line
           under it fade as one thing. That second line is the round's enemy speed
           on a round flash and the boss's name on BOSS ROUND — hence the generic
           id; it's empty for any announcement that doesn't have one. -->
      <div id="announce">
        <div id="announce-title"></div>
        <div id="announce-sub"></div>
      </div>
      <!-- Pickup notice, lower center: "HP RESTORED" or "AP RESTORED" when a drop is
           taken, tinted to match the item that was collected.
           hud.js writes the text and retriggers the CSS animation, the same dance as
           #announce — and like the muzzle flash, its duration lives in style.css and
           nowhere else. #announce's 1.2s has to be kept in step with ROUNDS.bossDelay
           by hand because the round machine waits on it; nothing waits on this, so it
           needs no config number at all. -->
      <div id="notice"></div>
      <!-- Boss health bar. hud.js projects the boss's world position to screen
           space and writes left/top every frame, so it tracks its head. -->
      <div id="bossbar" class="hidden"><div id="bossbar-fill"></div></div>
      <!-- Container for the floating "+100" score popups. Deliberately empty:
           hud.js fills it with a pool of POPUP.pool divs and anchors each to the
           world position of a kill. -->
      <div id="popups"></div>
      <!-- Rotating top-down radar. Sized and drawn by src/minimap.js; the
           circular mask and rim are CSS. -->
      <canvas id="minimap"></canvas>
      <!-- Build number, bottom right. Deliberately the one piece of HUD text no
           JS writes: nothing at runtime knows or changes it, so the literal lives
           here next to the element that shows it rather than being threaded
           through config.js and hud.js. Bump it by hand; this is the only place
           it appears. Kept out of package.json's `version` too, which is a semver
           for the package, not a build number for the game. -->
      <div id="build">BUILD 1.16</div>
    </div>

    <!-- Click-to-start / paused overlay. Shown whenever the pointer is unlocked.
         Keep it to one <p>: hud.showOverlay() writes the subtitle through
         querySelector('p'), which silently takes the first one. The controls used
         to be a second paragraph here; they live in #controls now, which is on
         screen during play and behind this overlay, so there's one list. -->
    <div id="overlay">
      <h1>DOOMSLOP</h1>
      <p>Click to play</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
