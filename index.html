<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DoomSlop</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23c8503c'/></svg>"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- Crosshair + readouts. Text is filled in by src/hud.js. -->
    <div id="hud" aria-hidden="true">
      <div id="crosshair"></div>
      <!-- Muzzle flash: a warm glow at the bottom of the screen, since there's
           no weapon model to flash. hud.js retriggers its CSS animation. -->
      <div id="muzzle"></div>
      <div id="readout">
        <span id="health">HP --</span>
        <span id="score">SCORE --</span>
        <span id="round">ROUND --</span>
        <span id="progress">KILLS --</span>
      </div>
      <!-- Controls reference, top left. Static text like #build — no JS reads or
           writes it, and it's the only list of the controls anywhere: the overlay
           used to repeat the movement keys, which meant two copies to keep in
           step. Visible during play and dimmed behind the pause overlay, so it
           covers the start screen too. -->
      <div id="controls">
        <span class="key">WASD</span><span>MOVE</span>
        <span class="key">SPACE</span><span>JUMP</span>
        <span class="key">MOUSE</span><span>LOOK</span>
        <span class="key">CLICK</span><span>SHOOT</span>
        <span class="key">ESC</span><span>PAUSE</span>
        <span class="key">~</span><span>SKIP ROUND</span>
      </div>
      <!-- Round and boss announcements. hud.js sets the text and retriggers the
           CSS animation. The flash lives on the wrapper so the title and the line
           under it fade as one thing. That second line is the round's enemy speed
           on a round flash and the boss's name on BOSS ROUND — hence the generic
           id; it's empty for any announcement that doesn't have one. -->
      <div id="announce">
        <div id="announce-title"></div>
        <div id="announce-sub"></div>
      </div>
      <!-- Boss health bar. hud.js projects the boss's world position to screen
           space and writes left/top every frame, so it tracks its head. -->
      <div id="bossbar" class="hidden"><div id="bossbar-fill"></div></div>
      <!-- Container for the floating "+100" score popups. Deliberately empty:
           hud.js fills it with a pool of POPUP.pool divs and anchors each to the
           world position of a kill. -->
      <div id="popups"></div>
      <!-- Rotating top-down radar. Sized and drawn by src/minimap.js; the
           circular mask and rim are CSS. -->
      <canvas id="minimap"></canvas>
      <!-- Build number, bottom right. Deliberately the one piece of HUD text no
           JS writes: nothing at runtime knows or changes it, so the literal lives
           here next to the element that shows it rather than being threaded
           through config.js and hud.js. Bump it by hand; this is the only place
           it appears. Kept out of package.json's `version` too, which is a semver
           for the package, not a build number for the game. -->
      <div id="build">BUILD 1.05</div>
    </div>

    <!-- Click-to-start / paused overlay. Shown whenever the pointer is unlocked.
         Keep it to one <p>: hud.showOverlay() writes the subtitle through
         querySelector('p'), which silently takes the first one. The controls used
         to be a second paragraph here; they live in #controls now, which is on
         screen during play and behind this overlay, so there's one list. -->
    <div id="overlay">
      <h1>DOOMSLOP</h1>
      <p>Click to play</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
